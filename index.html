<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דשבורד מעקב יומי, כושר ותזונה</title>
    <!-- ספריות חיצוניות לגרפים וקונפטי -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-black: #000000;
            --card-bg: #0c0f17;
            --card-border: #1a2233;
            --accent-purple: #9333ea;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #05070a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-black);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-pink), transparent);
            opacity: 0.6;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }

        @media (max-width: 640px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-purple);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            transition: transform 0.15s, opacity 0.2s;
            margin-top: 8px;
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #161d2f;
            color: var(--text-muted);
            box-shadow: none;
            margin-top: 0;
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .btn-secondary:hover {
            color: #fff;
            background: #1f293d;
        }

        /* פס התקדמות משקל */
        .progress-wrapper {
            margin-top: 14px;
            background: #05070a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
        }

        .progress-bar-bg {
            background: #1a2233;
            height: 18px;
            border-radius: 9px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            border-radius: 9px;
            width: 0%;
            transition: width 0.8s ease-in-out;
        }

        /* הרגלים ומתיחות */
        .checklist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #05070a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-purple);
        }

        /* כרטיסי סיכום */
        .stat-card {
            background: #05070a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stat-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--accent-cyan); }

        /* טבלאות */
        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            font-size: 0.88rem;
        }

        .log-table th {
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 6px;
            text-align: right;
        }

        .log-table td {
            border-bottom: 1px solid #141824;
            padding: 10px 6px;
            text-align: right;
            color: #e2e8f0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 0;
            width: auto;
            font-size: 1.1rem;
            margin: 0;
        }

        /* כרטיסיות מתכונים ופריסטים */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .recipe-card {
            background: #070a12;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .recipe-card:hover {
            border-color: var(--accent-cyan);
            background: #0e1424;
            transform: translateY(-2px);
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .recipe-title {
            font-weight: 700;
            font-size: 0.92rem;
            color: #fff;
        }

        .recipe-ingredients {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.35;
            margin: 4px 0 8px 0;
        }

        .recipe-meta {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .recipe-cal { color: var(--accent-cyan); }
        .recipe-prot { color: var(--accent-pink); }

        .recipe-del {
            color: #ef4444;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            padding: 0 4px;
        }

        .recipe-del:hover {
            color: #f87171;
        }

        /* מודאל פופ-אפ חגיגי */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #0d111a;
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. מעקב משקל נוכחי וסרגל אחוזים -->
    <div class="card">
        <h2>⚖️ משקל גוף ומעקב Recomp</h2>
        <div style="display: flex; gap: 14px; align-items: flex-end;">
            <div style="flex: 1;">
                <label for="currentWeight">משקל גוף נוכחי (ק"ג):</label>
                <input type="number" id="currentWeight" step="0.1" placeholder="115">
            </div>
            <div style="flex: 1;">
                <button onclick="updateWeight()">שמור ועדכן</button>
            </div>
        </div>

        <div class="progress-wrapper">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 600;">התקדמות לעבר היעד (75 ק"ג):</span>
                <span id="progressPercentText" style="font-weight: 800; color: var(--accent-pink); font-size: 1.1rem;">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted);">
                <span>התחלה: 115 ק"ג</span>
                <span id="lostKgText">ירדו: 0 ק"ג</span>
                <span>יעד: 75 ק"ג</span>
            </div>
        </div>
    </div>

    <!-- 2. צ'קליסט הרגלים לקביעות יומית + שגרת גמישות -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; margin-bottom: 16px;">
            <h2 style="border: none; padding: 0; margin: 0;">✨ הרגלים יומיים וגמישות</h2>
            <button class="btn-secondary" onclick="resetDailyHabits()" style="width: auto;">איפוס יומי</button>
        </div>
        <div id="habitsContainer"></div>
    </div>

    <!-- 3. שכלול מעקב אימוני כוח דינמי -->
    <div class="card">
        <h2>🏋️‍♀️ מעקב אימוני כוח</h2>
        <div class="grid-2">
            <div>
                <label for="liftDate">תאריך:</label>
                <input type="date" id="liftDate">
            </div>
            <div>
                <label for="liftExercise">תרגיל:</label>
                <select id="liftExercise" onchange="handleExerciseChange()">
                    <option value="Squat">סקוואט (Squat)</option>
                    <option value="Bench Press">לחיצת חזה (Bench Press)</option>
                    <option value="Deadlift">דדליפט (Deadlift)</option>
                    <option value="Overhead Press">פרס (OHP)</option>
                    <option value="Assisted Pull-up">מתח עם עזרה (Assisted Pull-up)</option>
                </select>
            </div>
            <div>
                <label id="liftWeightLabel" for="liftWeight">משקל שהורם (ק"ג):</label>
                <input type="number" id="liftWeight" step="0.5" placeholder="80">
            </div>
            <div>
                <label for="liftReps">חזרות:</label>
                <input type="number" id="liftReps" min="1" placeholder="5">
            </div>
        </div>
        <button onclick="logLift()">תעד אימון למעקב</button>

        <div style="margin-top: 20px;">
            <label>יחס חוזק למשקל גוף (שיא 1RM ביחס למשקלך הנוכחי):</label>
            <div class="grid-4" id="ratioSummary"></div>
        </div>

        <div style="margin-top: 24px; position: relative; height: 300px;">
            <canvas id="strengthChart"></canvas>
        </div>

        <table class="log-table">
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>תרגיל</th>
                    <th>משקל / עזרה</th>
                    <th>חזרות</th>
                    <th>1RM משוער</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="strengthLogsTable"></tbody>
        </table>
    </div>

    <!-- 4. מחשבון ארוחות, קלוריות וחלבון יומי + מאגר מתכונים/פריסטים עם רכיבים -->
    <div class="card">
        <h2>🥗 לוג ומחשבון תזונה יומי</h2>
        
        <div class="grid-2" style="margin-bottom: 16px;">
            <div class="stat-card">
                <div class="stat-title">סה"כ קלוריות היום</div>
                <div class="stat-value" id="totalCalsToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">סה"כ חלבון היום</div>
                <div class="stat-value" id="totalProtToday" style="color: var(--accent-pink);">0g</div>
            </div>
        </div>

        <!-- כפתורי שליפה מהירה + הוספת מתכון/פריסט חדש -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="margin: 0;">בחירת מתכון / פריסט מוכן:</label>
            <button class="btn-secondary" onclick="toggleNewPresetBox()" style="width: auto; padding: 4px 10px; font-size: 0.8rem;">+ הוסף מתכון/פריסט חדש</button>
        </div>
        
        <!-- טופס הוספת מתכון/פריסט חדש -->
        <div id="newPresetBox" style="display: none; background: #05070a; border: 1px dashed var(--card-border); border-radius: 10px; padding: 14px; margin-bottom: 16px;">
            <div class="grid-3" style="margin-bottom: 8px;">
                <input type="text" id="presetNewName" placeholder="שם המנה (למשל: מוקפץ טופו ושעועית)">
                <input type="number" id="presetNewCals" placeholder="קלוריות (קק״ל)">
                <input type="number" id="presetNewProt" placeholder="חלבון (גרם)">
            </div>
            <input type="text" id="presetNewIngredients" placeholder="תקציר רכיבים (למשל: 300ג שעועית ירוקה, כף שמן זית, חצי חבילת טופו)" style="margin-bottom: 8px;">
            <button onclick="saveCustomPreset()" style="padding: 8px; font-size: 0.85rem;">שמור מתכון למאגר</button>
        </div>

        <!-- תצוגת כרטיסיות מתכונים עם רכיבים -->
        <div id="presetsContainer" class="recipes-grid"></div>

        <!-- טופס הזנת ארוחה ליומן -->
        <div class="grid-3">
            <div>
                <label for="mealName">שם פריט / ארוחה שנבחרה:</label>
                <input type="text" id="mealName" placeholder="הזנה חופשית או בחירה ממתכון...">
            </div>
            <div>
                <label for="mealCals">קלוריות (kcal):</label>
                <input type="number" id="mealCals" placeholder="350">
            </div>
            <div>
                <label for="mealProt">חלבון (גרם):</label>
                <input type="number" id="mealProt" placeholder="30">
            </div>
        </div>
        <button onclick="addMeal()">הוסף ליומן היום</button>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">ארוחות שנרשמו היום:</span>
            <button class="btn-secondary" onclick="clearTodayMeals()" style="width: auto;">ניקוי יומן ארוחות</button>
        </div>

        <table class="log-table">
            <thead>
                <tr>
                    <th>ארוחה</th>
                    <th>קלוריות</th>
                    <th>חלבון</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="mealsTableBody"></tbody>
        </table>
    </div>

</div>

<!-- מודאל פופ-אפ חגיגי לתגמול שנפתח -->
<div id="celebrationModal" class="modal-overlay">
    <div class="modal-content">
        <div style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
        <h3 id="modalTitle" style="color: #fff; font-size: 1.5rem; margin: 0 0 10px 0;"></h3>
        <p id="modalDesc" style="color: var(--text-muted); font-size: 1.05rem; line-height: 1.5; margin-bottom: 24px;"></p>
        <button onclick="closeModal()">איזה כיף, ממשיכים בכל הכוח! 🔥</button>
    </div>
</div>

<script>
    // סולם התגמולים המאושר שמור ברקע לפופ-אפ
    const rewardsMap = [
        { target: 95, title: "נפתח תגמול קיר טיפוס / בולדרינג! 🧗‍♀️", desc: "שברת את יעד ה-95 ק״ג! יחס הכוח-משקל שלך מוכן – זה הזמן לעלות על הקיר ולהרגיש קלילה ועוצמתית." },
        { target: 90, title: "נפתח תגמול FlyBox (מנהרת רוח)! 🌪️", desc: "הגעת ל-90 ק״ג! זרם האוויר מרים אותך בריחוף חלק ויציב. תאמי טיסה ותהני מהתעופה!" },
        { target: 85, title: "נפתח תגמול החלקה על הקרח! ⛸️", desc: "85 ק״ג! העומס על המפרקים והקרסוליים ירד משמעותית – עולים על הלהבים פעם ראשונה בביטחון ושליטה." },
        { target: 80, title: "נפתח תגמול רכיבה על סוסים בטבע! 🐎", desc: "80 ק״ג! הגעת בבטחה אל תוך הטווח התקני והנוח ביותר של חוות הרכיבה. תהני מהאוכף ומהטבע!" },
        { target: 78, title: "נפתח תגמול יוגה ערסלים (Aerial Yoga)! 🧘‍♀️", desc: "78 ק״ג! היפוכים, תלייה וריחוף בבדי ערסל תלויים בלי שום לחץ על הגוף. חוויה של קלילות מוחלטת." },
        { target: 75, title: "קו הסיום: סדנת אקרובטיקה ועמידות ידיים! 🤸‍♀️", desc: "ניצחון ענק! 75 ק״ג! הגעת ליעד הסופי של המסע. שליטה מוחלטת במשקל הגוף על מזרן – את פשוט לביאה!" }
    ];

    // הרגלים יומיים ומתיחות
    const defaultHabits = [
        "עמידה ביעד חלבון יומי",
        "שתיית 2.5–3 ליטר מים",
        "יעד צעדים / תנועה יומית",
        "שגרת מתיחות: פתיחת כתפיים, גב וחזה כנגד קיר (הכנה למתח)",
        "שגרת גמישות: מקרבי ירך, זוקפי גב ושורש כף יד (הכנה לאקרובטיקה וקרח)",
        "שינה איכותית והתאוששות"
    ];

    // פריסטים ראשוניים עם תקצירי רכיבים
    const initialPresets = [
        { 
            name: "מוקפץ טופו ושעועית ירוקה", 
            ingredients: "300ג שעועית ירוקה, כף שמן זית, 150ג טופו, סויה", 
            cals: 360, 
            prot: 28 
        },
        { 
            name: "שיבולת שועל וחלבון", 
            ingredients: "50ג שיבולת שועל, סקופ אבקת חלבון, מים/חלב שקדים, קינמון", 
            cals: 380, 
            prot: 35 
        },
        { 
            name: "חזה עוף / פסטרמה ביתית", 
            ingredients: "150ג חזה עוף/הודו צלוי בתבלינים", 
            cals: 220, 
            prot: 42 
        },
        { 
            name: "קוטג׳ / גבינה לבנה וירקות", 
            ingredients: "גביע קוטג׳ 5% (250ג), מלפפון, עגבנייה", 
            cals: 215, 
            prot: 28 
        }
    ];

    // שליפת נתונים מ-localStorage
    let currentWeight = parseFloat(localStorage.getItem('user_weight')) || 115;
    let strengthLogs = JSON.parse(localStorage.getItem('strength_logs')) || [];
    let mealsLogs = JSON.parse(localStorage.getItem('daily_meals_logs')) || [];
    let customPresets = JSON.parse(localStorage.getItem('custom_meal_presets')) || initialPresets;
    let checkedHabits = JSON.parse(localStorage.getItem('checked_habits')) || {};
    let celebratedTargets = JSON.parse(localStorage.getItem('celebrated_targets')) || [];
    let chartInstance = null;

    document.getElementById('currentWeight').value = currentWeight;
    document.getElementById('liftDate').valueAsDate = new Date();

    // 1. משקל וסרגל התקדמות
    function updateWeight() {
        const val = parseFloat(document.getElementById('currentWeight').value);
        if (val && val > 0) {
            currentWeight = val;
            localStorage.setItem('user_weight', currentWeight);
            checkRewards(currentWeight);
            renderProgress();
            renderChartAndRatios();
        }
    }

    function checkRewards(weight) {
        rewardsMap.forEach(r => {
            if (weight <= r.target && !celebratedTargets.includes(r.target)) {
                triggerCelebrationModal(r);
                celebratedTargets.push(r.target);
                localStorage.setItem('celebrated_targets', JSON.stringify(celebratedTargets));
            }
        });
    }

    function triggerCelebrationModal(reward) {
        if (typeof confetti === 'function') {
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
        }
        document.getElementById('modalTitle').innerText = reward.title;
        document.getElementById('modalDesc').innerText = reward.desc;
        document.getElementById('celebrationModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('celebrationModal').style.display = 'none';
    }

    function renderProgress() {
        const start = 115;
        const goal = 75;
        const lost = Math.max(0, start - currentWeight);
        const total = start - goal;
        const pct = Math.min(100, Math.max(0, (lost / total) * 100));

        document.getElementById('progressBarFill').style.width = `${pct}%`;
        document.getElementById('progressPercentText').innerText = `${pct.toFixed(1)}%`;
        document.getElementById('lostKgText').innerText = `ירדו: ${lost.toFixed(1)} ק"ג`;
    }

    // 2. הרגלים ומתיחות
    function renderHabits() {
        const container = document.getElementById('habitsContainer');
        container.innerHTML = '';
        defaultHabits.forEach((habit, idx) => {
            const isChecked = checkedHabits[idx] ? 'checked' : '';
            const div = document.createElement('div');
            div.className = 'checklist-item';
            div.innerHTML = `
                <span style="font-size: 0.9rem;">${habit}</span>
                <input type="checkbox" onchange="toggleHabit(${idx})" ${isChecked}>
            `;
            container.appendChild(div);
        });
    }

    function toggleHabit(idx) {
        checkedHabits[idx] = !checkedHabits[idx];
        localStorage.setItem('checked_habits', JSON.stringify(checkedHabits));
    }

    function resetDailyHabits() {
        checkedHabits = {};
        localStorage.setItem('checked_habits', JSON.stringify(checkedHabits));
        renderHabits();
    }

    // 3. אימונים, מתח עם עזרה, יחסי כוח וגרף
    function handleExerciseChange() {
        const ex = document.getElementById('liftExercise').value;
        const label = document.getElementById('liftWeightLabel');
        const input = document.getElementById('liftWeight');

        if (ex === "Assisted Pull-up") {
            label.innerText = "משקל עזרה במכונה (המטרה: לרדת ל-0):";
            input.placeholder = "משקל עזרה בק״ג";
        } else {
            label.innerText = "משקל שהורם (ק״ג):";
            input.placeholder = "80";
        }
        renderChartAndRatios();
    }

    function calculate1RM(weight, reps) {
        if (reps === 1) return weight;
        return Math.round(weight * (1 + reps / 30) * 10) / 10;
    }

    function logLift() {
        const date = document.getElementById('liftDate').value;
        const exercise = document.getElementById('liftExercise').value;
        const weight = parseFloat(document.getElementById('liftWeight').value);
        const reps = parseInt(document.getElementById('liftReps').value, 10);

        if (!date || isNaN(weight) || isNaN(reps) || weight < 0 || reps <= 0) {
            alert('נא למלא ערכים תקינים.');
            return;
        }

        const metric = exercise === "Assisted Pull-up" ? weight : calculate1RM(weight, reps);
        const newEntry = { id: Date.now(), date, exercise, weight, reps, metric };

        strengthLogs.push(newEntry);
        strengthLogs.sort((a, b) => new Date(a.date) - new Date(b.date));
        localStorage.setItem('strength_logs', JSON.stringify(strengthLogs));

        document.getElementById('liftWeight').value = '';
        document.getElementById('liftReps').value = '';

        renderStrengthLogs();
        renderChartAndRatios();
    }

    function deleteLift(id) {
        strengthLogs = strengthLogs.filter(l => l.id !== id);
        localStorage.setItem('strength_logs', JSON.stringify(strengthLogs));
        renderStrengthLogs();
        renderChartAndRatios();
    }

    function renderStrengthLogs() {
        const tbody = document.getElementById('strengthLogsTable');
        tbody.innerHTML = '';

        [...strengthLogs].reverse().forEach(log => {
            const isPullup = log.exercise === "Assisted Pull-up";
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${log.date}</td>
                <td>${log.exercise}</td>
                <td>${log.weight} ק"ג ${isPullup ? '(עזרה)' : ''}</td>
                <td>${log.reps}</td>
                <td style="color: ${isPullup ? 'var(--accent-orange)' : 'var(--accent-cyan)'}">
                    <strong>${isPullup ? `${log.weight} ק"ג עזרה` : `${log.metric} ק"ג`}</strong>
                </td>
                <td><button class="delete-btn" onclick="deleteLift(${log.id})">✕</button></td>
            `;
            tbody.appendChild(row);
        });
    }

    function renderChartAndRatios() {
        const currentExercise = document.getElementById('liftExercise').value;
        const isPullup = currentExercise === "Assisted Pull-up";
        const filteredLogs = strengthLogs.filter(l => l.exercise === currentExercise);

        const exercises = ["Squat", "Bench Press", "Deadlift", "Overhead Press", "Assisted Pull-up"];
        const ratioContainer = document.getElementById('ratioSummary');
        ratioContainer.innerHTML = '';

        exercises.forEach(ex => {
            const exLogs = strengthLogs.filter(l => l.exercise === ex);
            const card = document.createElement('div');
            card.className = 'stat-card';

            if (ex === "Assisted Pull-up") {
                let minHelp = exLogs.length > 0 ? Math.min(...exLogs.map(l => l.weight)) : null;
                card.innerHTML = `
                    <div class="stat-title">מתח עם עזרה</div>
                    <div class="stat-value" style="color: var(--accent-orange);">${minHelp !== null ? `${minHelp} ק״ג` : '-'}</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);">${minHelp === 0 ? 'מתח חופשי!' : 'עזרה הכי נמוכה'}</div>
                `;
            } else {
                let max1RM = exLogs.length > 0 ? Math.max(...exLogs.map(l => l.metric)) : 0;
                const ratio = (currentWeight > 0 && max1RM > 0) ? (max1RM / currentWeight).toFixed(2) : '-';
                card.innerHTML = `
                    <div class="stat-title">${ex}</div>
                    <div class="stat-value">${ratio !== '-' ? `x${ratio}` : '-'}</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);">${max1RM ? `${max1RM} ק"ג שיא` : 'אין נתונים'}</div>
                `;
            }
            ratioContainer.appendChild(card);
        });

        const ctx = document.getElementById('strengthChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: filteredLogs.map(l => l.date),
                datasets: [{
                    label: isPullup ? 'משקל עזרה במכונה (ירידה ל-0 = מתח חופשי)' : `1RM משוער (${currentExercise})`,
                    data: filteredLogs.map(l => isPullup ? l.weight : l.metric),
                    borderColor: isPullup ? '#f59e0b' : '#a855f7',
                    backgroundColor: isPullup ? 'rgba(245, 158, 11, 0.15)' : 'rgba(168, 85, 247, 0.15)',
                    tension: 0.25,
                    fill: true,
                    pointBackgroundColor: isPullup ? '#f59e0b' : '#ec4899',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8' } } },
                scales: {
                    x: { ticks: { color: '#64748b' }, grid: { color: '#1a2233' } },
                    y: { 
                        ticks: { color: '#64748b' }, 
                        grid: { color: '#1a2233' },
                        title: { display: true, text: isPullup ? 'עזרה (ק״ג)' : 'משקל 1RM (ק״ג)', color: '#94a3b8' }
                    }
                }
            }
        });
    }

    // 4. ניהול מתכונים ופריסטים
    function toggleNewPresetBox() {
        const box = document.getElementById('newPresetBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function saveCustomPreset() {
        const name = document.getElementById('presetNewName').value.trim();
        const ingredients = document.getElementById('presetNewIngredients').value.trim();
        const cals = parseInt(document.getElementById('presetNewCals').value, 10);
        const prot = parseInt(document.getElementById('presetNewProt').value, 10) || 0;

        if (!name || isNaN(cals) || cals <= 0) {
            alert('נא למלא שם מתכון ומספר קלוריות.');
            return;
        }

        customPresets.push({ name, ingredients, cals, prot });
        localStorage.setItem('custom_meal_presets', JSON.stringify(customPresets));

        document.getElementById('presetNewName').value = '';
        document.getElementById('presetNewIngredients').value = '';
        document.getElementById('presetNewCals').value = '';
        document.getElementById('presetNewProt').value = '';
        toggleNewPresetBox();

        renderPresets();
    }

    function deletePreset(index, event) {
        event.stopPropagation();
        if (confirm('למחוק מתכון זה ממאגר הפריסטים?')) {
            customPresets.splice(index, 1);
            localStorage.setItem('custom_meal_presets', JSON.stringify(customPresets));
            renderPresets();
        }
    }

    function renderPresets() {
        const container = document.getElementById('presetsContainer');
        container.innerHTML = '';

        customPresets.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.onclick = () => selectRecipe(p);
            
            const ingText = p.ingredients ? p.ingredients : 'ללא פירוט רכיבים';

            card.innerHTML = `
                <div>
                    <div class="recipe-header">
                        <span class="recipe-title">${p.name}</span>
                        <span class="recipe-del" onclick="deletePreset(${idx}, event)" title="מחק">✕</span>
                    </div>
                    <div class="recipe-ingredients">${ingText}</div>
                </div>
                <div class="recipe-meta">
                    <span class="recipe-cal">${p.cals} kcal</span>
                    <span>•</span>
                    <span class="recipe-prot">${p.prot}g חלבון</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function selectRecipe(p) {
        document.getElementById('mealName').value = p.ingredients ? `${p.name} (${p.ingredients})` : p.name;
        document.getElementById('mealCals').value = p.cals;
        document.getElementById('mealProt').value = p.prot;
    }

    function addMeal() {
        const name = document.getElementById('mealName').value.trim();
        const cals = parseInt(document.getElementById('mealCals').value, 10);
        const prot = parseInt(document.getElementById('mealProt').value, 10) || 0;

        if (!name || isNaN(cals) || cals <= 0) {
            alert('נא להזין שם ארוחה ומספר קלוריות.');
            return;
        }

        mealsLogs.push({ id: Date.now(), name, cals, prot });
        localStorage.setItem('daily_meals_logs', JSON.stringify(mealsLogs));

        document.getElementById('mealName').value = '';
        document.getElementById('mealCals').value = '';
        document.getElementById('mealProt').value = '';

        renderMeals();
    }

    function deleteMeal(id) {
        mealsLogs = mealsLogs.filter(m => m.id !== id);
        localStorage.setItem('daily_meals_logs', JSON.stringify(mealsLogs));
        renderMeals();
    }

    function clearTodayMeals() {
        if (confirm('לאפס את יומן הארוחות של היום?')) {
            mealsLogs = [];
            localStorage.setItem('daily_meals_logs', JSON.stringify(mealsLogs));
            renderMeals();
        }
    }

    function renderMeals() {
        const tbody = document.getElementById('mealsTableBody');
        tbody.innerHTML = '';

        let totalC = 0;
        let totalP = 0;

        mealsLogs.forEach(m => {
            totalC += m.cals;
            totalP += m.prot;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${m.name}</td>
                <td>${m.cals} kcal</td>
                <td>${m.prot}g חלבון</td>
                <td><button class="delete-btn" onclick="deleteMeal(${m.id})">✕</button></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('totalCalsToday').innerText = totalC;
        document.getElementById('totalProtToday').innerText = `${totalP}g`;
    }

    // אתחול מלא
    renderProgress();
    renderHabits();
    renderStrengthLogs();
    renderChartAndRatios();
    renderPresets();
    renderMeals();
</script>

</body>
</html>
